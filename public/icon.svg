<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Gold Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Fast Food Burger & Receipt Icon -->
  <g transform="translate(96, 100)">
    <!-- Top Bun -->
    <path d="M 40 130 C 40 50, 280 50, 280 130 Z" fill="url(#goldGrad)" />
    <circle cx="110" cy="85" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="160" cy="75" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="210" cy="85" r="5" fill="#78350f" opacity="0.6"/>
    
    <!-- Cheese & Lettuce -->
    <polygon points="30,140 160,165 290,140 270,150 160,175 50,150" fill="#22c55e"/>
    <polygon points="50,145 270,145 240,165 180,155 120,170 80,155" fill="#eab308"/>
    
    <!-- Patty -->
    <rect x="35" y="170" width="250" height="28" rx="14" fill="#78350f"/>
    
    <!-- Bottom Bun -->
    <path d="M 40 210 Q 160 210 280 210 Q 280 250 260 260 Q 160 265 60 260 Q 40 250 40 210 Z" fill="url(#goldGrad)"/>
    
    <!-- Thermal Receipt Slip / POS Badge -->
    <g transform="translate(180, 180)">
      <rect x="0" y="0" width="110" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
      <line x1="20" y1="28" x2="90" y2="28" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <line x1="20" y1="46" x2="70" y2="46" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="62" x2="85" y2="62" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="84" x2="90" y2="84" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
